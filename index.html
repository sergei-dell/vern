<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вэрн</title>

<!--
  index.html — ЕДИНСТВЕННЫЙ АДРЕС ПРОЕКТА.

  Раньше ссылок было три: сборка героя, мир и набор деталей. Теперь
  одна, и переключение идёт БЕЗ ПЕРЕЗАГРУЗКИ — этим заведует вэрн.be4d00a6.js.

  Внутри два дома:
    #дом-сборки  — вступление, конструктор, готовый герой
    #дом-мира    — ворота, карта, лавка, стол

  Дома нужны затем, что у каждой части свои экраны и своё
  переключение. Показан всегда ровно один дом.

  Видимого текста здесь нет намеренно: у каждого места стоит метка
  data-т, а сам текст подставляется из данных. Так владелец правит
  надписи в одном файле и не лезет в разметку.

  Ни одной ссылки на чужой сервер. Скрипта Телеграма здесь больше
  нет: главный вход — браузер, а без чужих ссылок страница работает
  и с отключённой сетью.
-->

<link rel="stylesheet" href="стиль.e59c4df1.css">
<link rel="stylesheet" href="герой/сборка.730b5e0d.css">
<link rel="stylesheet" href="мир/страницы.ca8e0070.css">
</head>
<body>
<!--
  Набор силуэтов ларьков. Лежит прямо здесь, а не отдельными файлами:
  ноль лишних запросов, красится из оформления, весит единицы килобайт.

  Холст 0 0 48 48 — тот же, что у знаков народов в настройки.js.
  Земля на уровне y=42.

  Цвета не зашиты: контур, огонёк, дым и фигурки берутся из
  переменных оформления. Переменные проходят внутрь use, поэтому
  состояние ларька меняется одним классом на обёртке.
-->
<svg class="набор-силуэтов" aria-hidden="true" focusable="false">
  <defs>

    <!-- СТОЛЫ · ПЛОСКИЙ навес на столбах, под ним круглый стол.
         Крыша нарочно ровная: у мастерских она домиком, у рядов
         фестонами. По форме крыши квартал и узнаётся издалека. -->
    <symbol id="силуэт-столы" viewBox="0 0 48 48">
      <g fill="none" stroke="var(--контур)" stroke-width="2.4"
         stroke-linejoin="round" stroke-linecap="round">
        <path d="M2 15 H46"/>
        <path d="M6 15 V19 M42 15 V19"/>
        <circle cx="24" cy="22" r="3.4" fill="var(--огонь)" stroke="none"/>
        <path d="M7 15 V42 M41 15 V42"/>
        <ellipse cx="24" cy="31" rx="11" ry="3.4"/>
        <path d="M24 34 V39"/>
        <path d="M18 39 H30"/>
        <path d="M2 42 H46"/>
        <g fill="var(--фигуры)" stroke="none">
          <circle cx="12" cy="33" r="2.8"/>
          <circle cx="36" cy="33" r="2.8"/>
        </g>
      </g>
    </symbol>

    <!-- МАСТЕРСКИЕ · кузня: крыша домиком, труба с дымом,
         арка горна и наковальня перед ней -->
    <symbol id="силуэт-мастерские" viewBox="0 0 48 48">
      <g fill="none" stroke="var(--контур)" stroke-width="2.4"
         stroke-linejoin="round" stroke-linecap="round">
        <g fill="var(--дым)" stroke="none">
          <circle cx="35" cy="9" r="2.6"/>
          <circle cx="39" cy="4.5" r="2"/>
        </g>
        <rect x="32" y="11" width="6" height="8"/>
        <path d="M5 22 L24 9 L43 22"/>
        <path d="M9 22 V42 H39 V22"/>
        <path d="M18 42 V33 A6 6 0 0 1 30 33 V42 Z"
              fill="var(--огонь)" stroke="var(--контур)"/>
        <path d="M2 42 H46"/>
        <g fill="var(--фигуры)" stroke="none">
          <path d="M3 38 H15 L13 34 H5 Z"/>
          <rect x="7.5" y="38" width="3" height="4"/>
        </g>
      </g>
    </symbol>

    <!-- РЯДЫ · прилавок под полосатым тентом -->
    <symbol id="силуэт-ряды" viewBox="0 0 48 48">
      <g fill="none" stroke="var(--контур)" stroke-width="2.4"
         stroke-linejoin="round" stroke-linecap="round">
        <circle cx="24" cy="24" r="4" fill="var(--огонь)" stroke="none"/>
        <path d="M4 17 H44 L44 21 Q37 26 31 21 Q24 26 17 21 Q11 26 4 21 Z"/>
        <path d="M17 17 V21 M31 17 V21"/>
        <path d="M6 21 V31 M42 21 V31"/>
        <path d="M8 31 H40 V38 H8 Z"/>
        <path d="M8 42 H40"/>
        <path d="M2 42 H46"/>
        <g fill="var(--фигуры)" stroke="none">
          <circle cx="14" cy="36" r="2.6"/>
          <circle cx="34" cy="36" r="2.6"/>
        </g>
      </g>
    </symbol>

    <!-- СВОБОДНО · голый каркас без крыши -->
    <symbol id="силуэт-свободно" viewBox="0 0 48 48">
      <g fill="none" stroke="var(--контур)" stroke-width="2.4"
         stroke-linejoin="round" stroke-linecap="round"
         stroke-dasharray="5 4">
        <path d="M7 19 H41"/>
        <path d="M10 19 V42 M38 19 V42"/>
        <path d="M10 30 H38"/>
        <path d="M2 42 H46"/>
      </g>
    </symbol>

    <!-- СЕРДЦЕ · кратер с водой, что не отражает неба -->
    <symbol id="силуэт-сердце" viewBox="0 0 48 48">
      <circle cx="24" cy="24" r="17" fill="var(--огонь)" opacity="0.13"/>
      <circle cx="24" cy="24" r="11" fill="var(--огонь)" opacity="0.22"/>
      <g fill="none" stroke="var(--контур)" stroke-width="2.2"
         stroke-linejoin="round">
        <circle cx="24" cy="24" r="17"/>
        <circle cx="24" cy="24" r="11"/>
        <circle cx="24" cy="24" r="4.5" fill="var(--огонь)" stroke="none"/>
      </g>
    </symbol>

  </defs>
</svg>

<!--
  Значки занятий. Рисуются линиями, холст 24×24, цвет берётся из
  оформления через currentColor — значит один и тот же значок годится
  и на тёплой вывеске, и на холодной.

  Семь названы в задании, три последних добавлены мной: в третьем
  кольце есть торг, ночлег и травы, а значков к ним не было.
-->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <g id="з-шахматы"><path d="M4 18h16M6 18l1-7M18 18l-1-7M7 11h10M7 11L5 6l3.5 2L12 4l3.5 4L19 6l-2 5"/></g>
  <g id="з-картинки"><rect x="3.5" y="5.5" width="17" height="13"/><path d="M3.5 15l5-5 4 4 3-2 5 4"/><circle cx="15.5" cy="9.5" r="1.4"/></g>
  <g id="з-видео"><rect x="3.5" y="6.5" width="12" height="11"/><path d="M15.5 10l5-3v10l-5-3z"/></g>
  <g id="з-карты"><rect x="3.5" y="6.5" width="9" height="13"/><path d="M13 6l6 2-4 12-6-2"/></g>
  <g id="з-гифки"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 8 8"/><path d="M20 12l-3-2.5M20 12l-3 2.5"/></g>
  <g id="з-музыка"><path d="M9 17V6l9-2v11"/><circle cx="7" cy="17" r="2"/><circle cx="16" cy="15" r="2"/></g>
  <g id="з-таро"><rect x="4.5" y="5.5" width="8" height="12"/><path d="M13 5l6 2-3 12-6-2"/><path d="M8.5 9.5v4M6.5 11.5h4"/></g>
  <g id="з-гороскопы"><circle cx="12" cy="12" r="7.5"/><path d="M12 4.5v15M4.5 12h15"/></g>
  <g id="з-торг"><path d="M12 4v14M6 8h12M6 8l-2.5 5h5zM18 8l2.5 5h-5zM8 20h8"/></g>
  <g id="з-ночлег"><path d="M4 19v-7l8-5 8 5v7"/><rect x="9.5" y="13.5" width="5" height="5.5"/></g>
  <g id="з-травы"><path d="M12 20V9"/><path d="M12 13c-4 0-5-3-5-5 3 0 5 2 5 5z"/><path d="M12 11c4 0 5-3 5-5-3 0-5 2-5 5z"/></g>
  <g id="з-столб"><path d="M12 21V6"/><path d="M12 8h7l-2 2.5 2 2.5h-7"/><path d="M12 14H5l2 2.5-2 2.5h7"/></g>
</defs></svg>

<div class="окно">

<!-- ═══════════════════════════════════════════════════════════════
     ДОМ СБОРКИ · вступление, конструктор, готовый герой
     ═══════════════════════════════════════════════════════════════ -->
<div id="дом-сборки" hidden>


  <!-- ══ вступление ══════════════════════════════════════════════ -->
  <section id="э-вступление" hidden>
    <div class="вступление">
      <div class="надмир" data-т="надпись_мир"></div>
      <h1 class="крупно" data-т="заголовок_вступление"></h1>
      <p class="тускло" data-т="описание_вступление"></p>
    </div>
    <button class="кн главная" id="к-начать" data-т="кнопка_создать"></button>
    <!-- Запись героя ЕСТЬ, но прочитать её не вышло. Кнопка «создать»
         при этом прячется: новый герой затёр бы прежнего, а герой у
         нас «навсегда». -->
    <div class="поломка" id="поломка" hidden>
      <h2 data-т="поломка_заголовок"></h2>
      <p class="тускло" data-т="поломка_текст"></p>
      <button class="кн главная широкая" id="к-починить" data-т="кнопка_починить"></button>
      <button class="кн тихая широкая" id="к-сначала" data-т="кнопка_сначала"></button>
    </div>

    <p class="заметка" data-т="заметка_вступление"></p>
  </section>

  <!-- ══ конструктор ═════════════════════════════════════════════ -->
  <section id="э-конструктор" hidden>

    <!-- где ты сейчас -->
    <div class="полоска" id="полоска"></div>

    <!-- живой предпросмотр: виден на всех шагах, меняется сразу -->
    <div class="превью" id="превью">
      <div class="знак" id="знак-превью"></div>
      <div class="превью-текст">
        <b id="имя-превью"></b>
        <span id="облик-превью"></span>
      </div>
    </div>

    <!-- шаг 1 · народ -->
    <div class="шаг" id="шаг-1" hidden>
      <h2 data-т="заголовок_народ"></h2>
      <div id="народы"></div>
      <div class="кнопки">
        <button class="кн тихая" data-перемешать data-т="кнопка_перемешать"></button>
        <button class="кн главная" data-вперёд="2" data-т="кнопка_дальше"></button>
      </div>
    </div>

    <!-- шаг 2 · облик -->
    <div class="шаг" id="шаг-2" hidden>
      <!-- пол: влияет на лицо, поэтому УМНОЖАЕТ библиотеку вдвое.
           Стоит первым в шаге: остальное выбирается уже под него -->
      <h2 data-т="заголовок_пол"></h2>
      <div class="ряд" id="полы"></div>

      <h2 data-т="заголовок_телосложение"></h2>
      <div class="ряд" id="телосложения"></div>
      <h2 data-т="заголовок_цвет"></h2>
      <div class="ряд" id="цвета"></div>
      <h2 data-т="заголовок_отметина"></h2>
      <div class="ряд" id="отметины"></div>

      <!-- плащ: единственное, что не задано народом. Им красится
           фигурка, бегающая по карте мира -->
      <h2 data-т="заголовок_плащ"></h2>
      <div class="ряд" id="плащи"></div>

      <div class="кнопки">
        <button class="кн тихая" data-назад="1" data-т="кнопка_назад"></button>
        <button class="кн тихая" data-перемешать data-т="кнопка_перемешать"></button>
        <button class="кн главная" data-вперёд="3" data-т="кнопка_дальше"></button>
      </div>
    </div>

    <!-- шаг 3 · имя -->
    <div class="шаг" id="шаг-3" hidden>
      <h2 data-т="заголовок_имя"></h2>
      <input id="поле-имя" type="text" autocomplete="off" spellcheck="false">
      <div class="ошибка" id="ошибка-имени"></div>
      <div class="кнопки">
        <button class="кн тихая" data-назад="2" data-т="кнопка_назад"></button>
        <button class="кн главная" id="к-имя-дальше" data-вперёд="4" data-т="кнопка_дальше"></button>
      </div>
    </div>

    <!-- шаг 4 · подтверждение · отдельный экран, не всплывающее окно -->
    <div class="шаг" id="шаг-4" hidden>
      <h2 data-т="заголовок_проверка"></h2>
      <div class="сводка">
        <div class="знак крупный" id="знак-сводка"></div>
        <b id="имя-сводка"></b>
        <span id="облик-сводка"></span>
      </div>
      <div class="навсегда">
        <b data-т="навсегда_заголовок"></b>
        <span data-т="навсегда_текст"></span>
      </div>
      <div class="кнопки">
        <button class="кн тихая" data-назад="3" data-т="кнопка_изменить"></button>
        <button class="кн главная" id="к-подтвердить" data-т="кнопка_подтвердить"></button>
      </div>
    </div>
  </section>

  <!-- ══ готовый герой ═══════════════════════════════════════════ -->
  <section id="э-герой" hidden>
    <article class="итог" id="итог">
      <div class="портрет" id="портрет"></div>
      <div class="итог-низ">
        <h1 id="имя-героя"></h1>
        <div class="род" id="род-героя"></div>
        <p class="судьба" id="судьба-героя"></p>
        <p class="девиз" id="девиз-героя"></p>
        <div class="мир-подпись" id="подпись-мира"></div>
      </div>
    </article>

    <button class="кн главная широкая" id="к-в-мир" data-т="кнопка_в_мир"></button>
    <button class="кн тихая широкая" id="к-показать" data-т="кнопка_показать"></button>
    <button class="кн тихая широкая" id="к-портрет" hidden data-т="кнопка_портрет"></button>
    <div class="ошибка по-центру" id="сообщение"></div>

    <p class="заметка" data-т="герой_закреплён"></p>

    <div class="блок-мир">
      <h2 data-т="мир_заголовок"></h2>
      <p class="тускло мелко" data-т="мир_текст"></p>
    </div>

    <p class="заметка снизу">
      <button class="ссылка" id="к-заново" data-т="кнопка_заново"></button>
      <span data-т="заново_подпись"></span>
    </p>
  </section>

  <!-- холст для карточки: на экране не показывается -->
  <canvas id="холст" hidden></canvas>
</div>

<!-- ═══════════════════════════════════════════════════════════════
     ДОМ МИРА · ворота, карта, лавка, стол
     ═══════════════════════════════════════════════════════════════ -->
<div id="дом-мира" hidden>


  <!-- ══ ворота ══════════════════════════════════════════════════ -->
  <section id="э-ворота" hidden>
    <div class="ворота">
      <div class="надмир" data-т="надпись_мир"></div>
      <h1 class="крупно" data-т="заголовок_ворота"></h1>
      <p class="тускло" data-т="описание_ворота"></p>
    </div>
    <div id="герой-полоска" class="герой-полоска" hidden></div>
    <button class="кн главная" id="к-войти" data-т="кнопка_войти"></button>
    <p class="пример" data-т="пример_мира"></p>
  </section>

  <!-- ══ карта мира ══════════════════════════════════════════════ -->
  <section id="э-карта" hidden>
    <div class="двор" id="двор">
      <svg class="мир" id="мир" viewBox="0 0 1900 1900" aria-hidden="true">
        <g id="земля"></g>
        <g id="дороги"></g>
        <g id="постройки"></g>
        <g id="столбы"></g>
        <!-- метка цели стоит ПОД фигуркой: герой приходит на неё
             и не должен оказаться перечёркнутым -->
        <g id="метка"></g>
        <g id="фигура"></g>
      </svg>
    </div>

    <div class="мгла"></div>

    <div class="плашка-героя" id="плашка-героя" hidden></div>

    <div class="кольца-кнопки" id="кольца-кнопки"></div>
    <button class="к-герою" id="к-герою"></button>

    <!-- переделать героя: только в мире, мелко, в углу -->
    <button class="переделать" id="к-переделать" data-т="кнопка_переделать"></button>

    <div class="полоса" id="полоса" hidden></div>
    <p class="пример" data-т="пример_мира"></p>
  </section>

  <!-- ══ лавка ═══════════════════════════════════════════════════ -->
  <section id="э-лавка" hidden>
    <header class="шапка">
      <button class="стрелка" id="к-из-лавки" data-т="назад"></button>
      <h1 id="имя-лавки"></h1>
      <span class="стрелка пусто"></span>
    </header>

    <div class="хозяин" id="хозяин-лавки"></div>
    <p class="описание" id="описание-лавки"></p>

    <h2 id="заголовок-столов" data-т="лавка_столы"></h2>
    <div id="столы-лавки"></div>
    <p class="тускло мелко" id="лавка-примечание"></p>

    <p class="пример" data-т="пример_мира"></p>
  </section>

  <!-- ══ стол ════════════════════════════════════════════════════ -->
  <section id="э-стол" hidden>
    <header class="шапка">
      <button class="стрелка" id="к-из-стола" data-т="назад"></button>
      <h1 id="имя-стола"></h1>
      <span class="стрелка пусто"></span>
    </header>

    <div class="круг-стола" id="круг-стола"></div>
    <div class="чей-ход" id="чей-ход"></div>

    <!-- игровое поле: сейчас только шахматы -->
    <div id="поле-игры"></div>
    <p class="тускло мелко по-центру" id="стол-примечание"></p>

    <h2 data-т="стол_разговор"></h2>
    <div class="разговор" id="разговор"></div>
    <div class="строка-чата">
      <input id="поле-чата" type="text" autocomplete="off">
      <button class="кн тихая" id="к-сказать" data-т="стол_отправить"></button>
    </div>
    <p class="тускло мелко" data-т="стол_чат_местный"></p>

    <p class="пример" data-т="пример_мира"></p>
  </section>

  <!-- ══ лавка · шахматы, таро, круг года ════════════════════════ -->
  <section id="э-дело" hidden>
    <header class="шапка">
      <button class="стрелка" id="к-из-дела"></button>
      <h1 id="имя-дела"></h1>
      <span class="стрелка пусто"></span>
    </header>

    <p class="описание" id="о-деле"></p>

    <!-- сюда лавка кладёт своё: доску, расклад или круг года -->
    <div id="дело"></div>

    <!-- обязательная строка под гаданием: не вежливость, а правило -->
    <p class="оговорка" id="оговорка-дела" hidden></p>

    <p class="пример" data-т="пример_мира"></p>
  </section>

  <!-- ══ окошко ══════════════════════════════════════════════════ -->
  <div class="завеса" id="завеса" hidden>
    <div class="окошко">
      <h2 id="окошко-заголовок"></h2>
      <p id="окошко-текст"></p>
      <div class="кнопки" id="окошко-кнопки"></div>
    </div>
  </div>
</div>

</div>

<!-- данные обеих частей: у каждой свои имена, спорить им не о чем -->
<script src="герой/мир.1063994b.js"></script>
<script src="герой/настройки.9b2c9824.js"></script>
<script src="герой/брань.fd05b2df.js"></script>
<script src="мир/мир.803d847d.js"></script>
<script src="мир/настройки.83512e0f.js"></script>
