<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вэрн · Сердце</title>

<!--
  index.html — РАЗМЕТКА всех экранов мира-витрины.

  Видимого текста здесь нет: у каждого места стоит метка data-т, текст
  подставляется из мир.js. Так владелец правит надписи в одном файле.

  Экранов четыре: ворота, страница рынка, лавка, стол.
  Всё, что внутри них, собирается кодом из данных.
-->

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="стиль.css">
<link rel="stylesheet" href="страницы.css">
</head>
<body>
<!--
  Набор силуэтов ларьков. Лежит прямо здесь, а не отдельными файлами:
  ноль лишних запросов, красится из оформления, весит единицы килобайт.

  Холст 0 0 48 48 — тот же, что у знаков народов в настройки.js.
  Земля на уровне y=42.

  Цвета не зашиты: контур, огонёк, дым и фигурки берутся из
  переменных оформления. Переменные проходят внутрь use, поэтому
  состояние ларька меняется одним классом на обёртке.
-->
<svg class="набор-силуэтов" aria-hidden="true" focusable="false">
  <defs>

    <!-- СТОЛЫ · ПЛОСКИЙ навес на столбах, под ним круглый стол.
         Крыша нарочно ровная: у мастерских она домиком, у рядов
         фестонами. По форме крыши квартал и узнаётся издалека. -->
    <symbol id="силуэт-столы" viewBox="0 0 48 48">
      <g fill="none" stroke="var(--контур)" stroke-width="2.4"
         stroke-linejoin="round" stroke-linecap="round">
        <path d="M2 15 H46"/>
        <path d="M6 15 V19 M42 15 V19"/>
        <circle cx="24" cy="22" r="3.4" fill="var(--огонь)" stroke="none"/>
        <path d="M7 15 V42 M41 15 V42"/>
        <ellipse cx="24" cy="31" rx="11" ry="3.4"/>
        <path d="M24 34 V39"/>
        <path d="M18 39 H30"/>
        <path d="M2 42 H46"/>
        <g fill="var(--фигуры)" stroke="none">
          <circle cx="12" cy="33" r="2.8"/>
          <circle cx="36" cy="33" r="2.8"/>
        </g>
      </g>
    </symbol>

    <!-- МАСТЕРСКИЕ · кузня: крыша домиком, труба с дымом,
         арка горна и наковальня перед ней -->
    <symbol id="силуэт-мастерские" viewBox="0 0 48 48">
      <g fill="none" stroke="var(--контур)" stroke-width="2.4"
         stroke-linejoin="round" stroke-linecap="round">
        <g fill="var(--дым)" stroke="none">
          <circle cx="35" cy="9" r="2.6"/>
          <circle cx="39" cy="4.5" r="2"/>
        </g>
        <rect x="32" y="11" width="6" height="8"/>
        <path d="M5 22 L24 9 L43 22"/>
        <path d="M9 22 V42 H39 V22"/>
        <path d="M18 42 V33 A6 6 0 0 1 30 33 V42 Z"
              fill="var(--огонь)" stroke="var(--контур)"/>
        <path d="M2 42 H46"/>
        <g fill="var(--фигуры)" stroke="none">
          <path d="M3 38 H15 L13 34 H5 Z"/>
          <rect x="7.5" y="38" width="3" height="4"/>
        </g>
      </g>
    </symbol>

    <!-- РЯДЫ · прилавок под полосатым тентом -->
    <symbol id="силуэт-ряды" viewBox="0 0 48 48">
      <g fill="none" stroke="var(--контур)" stroke-width="2.4"
         stroke-linejoin="round" stroke-linecap="round">
        <circle cx="24" cy="24" r="4" fill="var(--огонь)" stroke="none"/>
        <path d="M4 17 H44 L44 21 Q37 26 31 21 Q24 26 17 21 Q11 26 4 21 Z"/>
        <path d="M17 17 V21 M31 17 V21"/>
        <path d="M6 21 V31 M42 21 V31"/>
        <path d="M8 31 H40 V38 H8 Z"/>
        <path d="M8 42 H40"/>
        <path d="M2 42 H46"/>
        <g fill="var(--фигуры)" stroke="none">
          <circle cx="14" cy="36" r="2.6"/>
          <circle cx="34" cy="36" r="2.6"/>
        </g>
      </g>
    </symbol>

    <!-- СВОБОДНО · голый каркас без крыши -->
    <symbol id="силуэт-свободно" viewBox="0 0 48 48">
      <g fill="none" stroke="var(--контур)" stroke-width="2.4"
         stroke-linejoin="round" stroke-linecap="round"
         stroke-dasharray="5 4">
        <path d="M7 19 H41"/>
        <path d="M10 19 V42 M38 19 V42"/>
        <path d="M10 30 H38"/>
        <path d="M2 42 H46"/>
      </g>
    </symbol>

    <!-- СЕРДЦЕ · кратер с водой, что не отражает неба -->
    <symbol id="силуэт-сердце" viewBox="0 0 48 48">
      <circle cx="24" cy="24" r="17" fill="var(--огонь)" opacity="0.13"/>
      <circle cx="24" cy="24" r="11" fill="var(--огонь)" opacity="0.22"/>
      <g fill="none" stroke="var(--контур)" stroke-width="2.2"
         stroke-linejoin="round">
        <circle cx="24" cy="24" r="17"/>
        <circle cx="24" cy="24" r="11"/>
        <circle cx="24" cy="24" r="4.5" fill="var(--огонь)" stroke="none"/>
      </g>
    </symbol>

  </defs>
</svg>

<div class="окно">

  <!-- ══ ворота ══════════════════════════════════════════════════ -->
  <section id="э-ворота" hidden>
    <div class="ворота">
      <div class="надмир" data-т="надпись_мир"></div>
      <h1 class="крупно" data-т="заголовок_ворота"></h1>
      <p class="тускло" data-т="описание_ворота"></p>
    </div>
    <div id="герой-полоска" class="герой-полоска" hidden></div>
    <button class="кн главная" id="к-войти" data-т="кнопка_войти"></button>
    <p class="пример" data-т="пример_мира"></p>
  </section>

  <!-- ══ страница рынка ══════════════════════════════════════════ -->
  <section id="э-страница" hidden>
    <header class="шапка">
      <button class="стрелка" id="к-предыдущая" data-т="назад"></button>
      <h1 id="имя-страницы"></h1>
      <button class="стрелка" id="к-следующая" data-т="вперёд"></button>
    </header>

    <div class="карта" id="карта"></div>

    <div class="точки" id="точки"></div>
    <p class="пример" data-т="пример_мира"></p>
  </section>

  <!-- ══ лавка ═══════════════════════════════════════════════════ -->
  <section id="э-лавка" hidden>
    <header class="шапка">
      <button class="стрелка" id="к-из-лавки" data-т="назад"></button>
      <h1 id="имя-лавки"></h1>
      <span class="стрелка пусто"></span>
    </header>

    <div class="хозяин" id="хозяин-лавки"></div>
    <p class="описание" id="описание-лавки"></p>

    <h2 id="заголовок-столов" data-т="лавка_столы"></h2>
    <div id="столы-лавки"></div>
    <p class="тускло мелко" id="лавка-примечание"></p>

    <p class="пример" data-т="пример_мира"></p>
  </section>

  <!-- ══ стол ════════════════════════════════════════════════════ -->
  <section id="э-стол" hidden>
    <header class="шапка">
      <button class="стрелка" id="к-из-стола" data-т="назад"></button>
      <h1 id="имя-стола"></h1>
      <span class="стрелка пусто"></span>
    </header>

    <div class="круг-стола" id="круг-стола"></div>
    <div class="чей-ход" id="чей-ход"></div>

    <!-- игровое поле: сейчас только шахматы -->
    <div id="поле-игры"></div>
    <p class="тускло мелко по-центру" id="стол-примечание"></p>

    <h2 data-т="стол_разговор"></h2>
    <div class="разговор" id="разговор"></div>
    <div class="строка-чата">
      <input id="поле-чата" type="text" autocomplete="off">
      <button class="кн тихая" id="к-сказать" data-т="стол_отправить"></button>
    </div>
    <p class="тускло мелко" data-т="стол_чат_местный"></p>

    <p class="пример" data-т="пример_мира"></p>
  </section>

  <!-- ══ окошко ══════════════════════════════════════════════════ -->
  <div class="завеса" id="завеса" hidden>
    <div class="окошко">
      <h2 id="окошко-заголовок"></h2>
      <p id="окошко-текст"></p>
      <div class="кнопки" id="окошко-кнопки"></div>
    </div>
  </div>

</div>

<script src="мир.js"></script>
<script src="настройки.js"></script>
<script src="ход.js"></script>
</body>
</html>
